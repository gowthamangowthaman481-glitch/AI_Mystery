services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix server install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_SCENARIO_LENGTH
        value: "1500"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
